apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops-mind
  labels:
    app: ai-ops-mind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-ops-mind
  template:
    metadata:
      labels:
        app: ai-ops-mind
    spec:
      containers:
      - name: ai-ops-mind
        image: ai-ops-mind:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DATABASE_URL
          value: "sqlite:///./app.db"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
